<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cakesbykaii Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f5;--card:#ffffff;--fg:#3b2a2a;--muted:#8a7070;--border:#f0dcd6;--accent:#d6527a;--accentfg:#ffffff;--ok:#1f7a4d;--okbg:#e3f5ea;--bad:#a8323e;--badbg:#fbe3e5;--past:#b9a9a9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1517;--card:#2a1f22;--fg:#f5e8e8;--muted:#b49a9a;--border:#443337;--accent:#f07a9f;--accentfg:#2a1020;--ok:#7fdca6;--okbg:#1d3a2b;--bad:#ff9aa4;--badbg:#4a2229;--past:#6f5c5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1517;--card:#2a1f22;--fg:#f5e8e8;--muted:#b49a9a;--border:#443337;--accent:#f07a9f;--accentfg:#2a1020;--ok:#7fdca6;--okbg:#1d3a2b;--bad:#ff9aa4;--badbg:#4a2229;--past:#6f5c5e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:130px 16px 32px;position:relative;z-index:1}
h1{font-size:1.9rem;margin:0 0 2px;text-align:center;color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.head b{font-size:1.05rem}
.nav{border:1px solid var(--border);background:transparent;color:var(--fg);width:36px;height:36px;border-radius:10px;font-size:1.1rem;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.75rem;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border:2px solid transparent;border-radius:10px;font-size:.95rem;cursor:pointer;background:var(--okbg);color:var(--ok);font-weight:600;font-family:inherit}
.day.booked{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.day.past{background:transparent;color:var(--past);font-weight:400;cursor:default;text-decoration:none}
.day.soon{background:transparent;color:var(--past);font-weight:400;text-decoration:line-through}
.day.today{border-color:var(--fg)}
.day.sel{border-color:var(--accent)}
.day.blank{visibility:hidden}
.legend{display:flex;gap:16px;justify-content:center;margin:12px 0 0;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.info{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);min-height:56px}
.info.ok{border-color:var(--ok)}.info.bad{border-color:var(--bad)}
.owner{margin-top:16px;padding:12px;border:1px dashed var(--accent);border-radius:12px;font-size:.9rem}
.btn{background:var(--accent);color:var(--accentfg);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
:root:root:root{--bg:#4a3b52;--card:#ffffff;--fg:#3b2f44;--muted:#7a6a82;--border:#e6dcea;--accent:#4a3b52;--accentfg:#ffffff;--ok:#1f7a4d;--okbg:#e3f5ea;--bad:#a8323e;--badbg:#fbe3e5;--past:#b9aec0;color-scheme:light}
.wrap{padding-top:24px}
h1{font-family:'Allura','Brush Script MT','Segoe Script',cursive;font-weight:400;font-size:3.1rem;line-height:1.05;color:#4a3b52;margin:0}
.sub{color:#6b5a74;margin:2px 0 118px;font-size:.9rem;letter-spacing:.04em}
.owner{color:#fff;border-color:rgba(255,255,255,.7)}
.owner .btn{background:#fff;color:#4a3b52}
.owner .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
#msg{color:#e9e1ee!important}
:root:root:root{--bg:#463b50;--accent:#463b50;--band:#ffffff}
.hero{margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--band),var(--band)) 0 0/100% calc(env(safe-area-inset-top,0px) + min(35vw,207px)) no-repeat}
.hero img{display:block;width:100%;max-width:591px;height:auto;margin:0 auto}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0;padding:0}
.wrap{padding-top:8px}
.sub{color:#efe8f3;margin:0 0 16px;font-size:.92rem}
:root:root:root[data-theme="dark"]{--bg:#463b50;--card:#2a2230;--fg:#f1e9f5;--muted:#b3a3bc;--border:#43384b;--accent:#c9a8e0;--accentfg:#1a141f;--ok:#7fdca6;--okbg:#1d3a2b;--bad:#ff9aa4;--badbg:#4a2229;--past:#6f6378;--band:#ffffff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:root:root:not([data-theme="light"]){--bg:#463b50;--card:#2a2230;--fg:#f1e9f5;--muted:#b3a3bc;--border:#43384b;--accent:#c9a8e0;--accentfg:#1a141f;--ok:#7fdca6;--okbg:#1d3a2b;--bad:#ff9aa4;--badbg:#4a2229;--past:#6f6378;--band:#ffffff;color-scheme:dark}}
.hero{position:relative}
.tg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:38px;height:38px;border-radius:50%;border:1px solid currentColor;background:transparent;color:#463b50;font-size:1.1rem;cursor:pointer;opacity:.85}
.stamp{text-align:center;color:#efe8f3;font-size:.8rem;margin-top:16px;opacity:.9}
.msgbox{margin-top:12px}
.msgtxt{border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.9rem;user-select:all;-webkit-user-select:all}
.msgbtn{flex:1 1 140px;text-align:center;text-decoration:none;background:var(--accent);color:var(--accentfg);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}
.msgnote{font-size:.75rem;color:var(--muted);margin-top:8px}
</style>
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

<script id="state" type="application/json">{"booked":["2026-11-09","2026-11-10","2026-11-11","2026-11-12","2026-11-13","2026-11-14","2026-11-20","2026-11-21","2026-11-22","2026-11-23","2026-11-24","2026-11-25","2026-11-26","2026-11-27","2026-11-28","2026-11-29","2026-11-30","2026-12-01","2026-12-02","2026-12-03","2026-12-11","2026-12-12","2026-12-13","2026-12-14","2026-12-15","2026-12-16","2026-12-17","2026-12-18","2026-12-19","2026-12-20","2026-12-21","2026-12-22","2026-12-23","2026-12-24","2026-12-25","2026-12-26","2026-12-27","2026-12-28","2026-12-29","2026-12-30","2026-12-31","2027-01-01","2027-01-02","2027-01-03","2027-01-04","2027-01-05","2027-01-06","2027-01-07","2027-01-08","2027-01-09","2027-01-10","2027-01-11","2027-01-12","2027-01-13","2027-01-14","2027-01-15","2027-02-07","2027-02-08","2027-02-09","2027-02-10","2027-02-11","2027-02-12","2027-02-13","2027-02-14","2027-03-07","2027-03-08","2027-03-09","2027-03-10","2027-03-11","2027-03-12","2027-03-13","2027-03-14","2027-03-15","2027-03-16","2027-03-17","2027-03-18","2027-03-19","2027-03-20"],"name":"Cakesbykaii","updated":"2026-11-08T18:31:45.902Z","contact":"Message us to confirm your order and reserve this date."}</script>
<script>
const S = JSON.parse(document.getElementById('state').textContent);
const booked = new Set(S.booked);
const today = new Date(); today.setHours(0,0,0,0);
const LEAD = 5; // minimum days of lead time
const minDate = new Date(today); minDate.setDate(minDate.getDate() + LEAD);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let sel = null, editing = false, canEdit = false, dirty = false, art = null, msg = '';
const pad = n => String(n).padStart(2,'0');
const key = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt = d => d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const root = document.getElementById('root');

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const atMin = y===today.getFullYear() && m===today.getMonth();
  let cells = ['S','M','T','W','T','F','S'].map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<first;i++) cells += '<button class="day blank" tabindex="-1"></button>';
  for(let d=1; d<=days; d++){
    const dt = new Date(y,m,d), k = key(dt);
    const past = dt < today;
    const soon = !past && dt < minDate;
    const cls = ['day', past?'past':'', soon?'soon':'', k===key(today)?'today':'', (!past&&!soon&&booked.has(k))?'booked':'', sel===k?'sel':''].join(' ');
    cells += '<button class="'+cls+'" data-k="'+k+'"'+(past&&!editing?' disabled':'')+'>'+d+'</button>';
  }
  root.innerHTML =
    '<h1 id="nm"></h1><p class="sub">Check if your event date is still open</p>'+
    '<div class="card"><div class="head"><button class="nav" id="prev" aria-label="Previous month"'+(atMin?' disabled':'')+'>‹</button>'+
    '<b>'+view.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b>'+
    '<button class="nav" id="next" aria-label="Next month">›</button></div><div class="grid">'+cells+'</div>'+
    '<div class="legend"><span><i style="background:var(--okbg);border:1px solid var(--ok)"></i>Available</span>'+
    '<span><i style="background:var(--badbg);border:1px solid var(--bad)"></i>Fully booked</span>'+
    '<span><i style="background:transparent;border:1px solid var(--past)"></i>Too soon</span>'+
    '<span><i style="background:transparent;border:2px solid var(--fg)"></i>Today</span></div>'+
    '<div class="msgnote" style="text-align:center">Orders need at least '+LEAD+' days’ lead time. No rush orders.</div></div>'+
    '<div class="info" id="info"></div><div id="owner"></div><div class="stamp" id="stamp"></div>';
  document.getElementById('nm').textContent = S.name;
  document.getElementById('prev').onclick = ()=>{view=new Date(y,m-1,1);render()};
  document.getElementById('next').onclick = ()=>{view=new Date(y,m+1,1);render()};
  root.querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  renderInfo(); renderOwner(); renderStamp();
}

function pick(k){
  const dt = new Date(k+'T00:00:00');
  if(editing){
    if(dt < today) return;
    booked.has(k) ? booked.delete(k) : booked.add(k);
    dirty = true; msg = ''; sel = k; render(); return;
  }
  sel = k; render();
}

function fb(t){try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}catch(e){}}
function copyTxt(t){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>fb(t));return}}catch(e){}fb(t)}

function renderInfo(){
  const el = document.getElementById('info');
  if(!sel){ el.textContent = 'Tap a date to see if we can make your cake.'; return; }
  const dt = new Date(sel+'T00:00:00');
  el.className = 'info';
  if(dt < today){ el.textContent = 'That date has already passed.'; return; }
  if(dt < minDate){
    el.classList.add('bad');
    el.innerHTML = '<b></b><br><span></span>';
    el.querySelector('b').textContent = fmt(dt)+' is too soon.';
    el.querySelector('span').textContent = 'We need at least '+LEAD+' days to prepare your order. The earliest date you can book is '+fmt(minDate)+'.';
    return;
  }
  if(booked.has(sel)){
    el.classList.add('bad');
    el.innerHTML = '<b></b><br><span></span>';
    el.querySelector('b').textContent = fmt(dt)+' is fully booked.';
    el.querySelector('span').textContent = 'Please try another date. We may be able to suggest nearby dates.';
  } else {
    el.classList.add('ok');
    el.innerHTML = '<b></b><br><span></span>';
    el.querySelector('b').textContent = 'Good news! '+fmt(dt)+' is available.';
    el.querySelector('span').textContent = S.contact;
    const txt = 'Hi Cakesbykaii! I’d like to book a cake for '+fmt(dt)+'. Is it still available?';
    const box = document.createElement('div'); box.className = 'msgbox';
    const p = document.createElement('div'); p.className = 'msgtxt'; p.textContent = txt;
    const row = document.createElement('div'); row.className = 'row';
    [['Messenger','https://m.me/cakesbykaiii'],['Instagram','https://ig.me/m/cakesbykaii']].forEach(([n,u])=>{
      const a = document.createElement('a'); a.className = 'msgbtn'; a.href = u; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Message on '+n; a.addEventListener('click',()=>copyTxt(txt)); row.appendChild(a);
    });
    const note = document.createElement('div'); note.className = 'msgnote';
    note.textContent = 'Tapping a button copies this message. Just paste it in the chat and send.';
    box.append(p,row,note); el.appendChild(box);
  }
}

function renderOwner(){
  const el = document.getElementById('owner');
  if(!canEdit){ el.innerHTML=''; return; }
  if(!editing){
    el.innerHTML = '<div class="owner">Owner tools<div class="row"><button class="btn" id="edit">Edit availability</button></div></div>';
    document.getElementById('edit').onclick = ()=>{editing=true;msg='';render()};
    return;
  }
  el.innerHTML = '<div class="owner"><b>Editing:</b> tap a date to mark it booked or available again, then save.'+
    '<div class="row"><button class="btn" id="save">Save &amp; publish</button><button class="btn ghost" id="cancel">Cancel</button></div>'+
    '<div id="msg" style="margin-top:8px;color:var(--muted)"></div></div>';
  document.getElementById('msg').textContent = msg;
  document.getElementById('save').onclick = save;
  document.getElementById('cancel').onclick = ()=>location.reload();
}

function renderStamp(){
  const el = document.getElementById('stamp'); if(!el) return;
  if(S.updated){
    const d = new Date(S.updated);
    el.textContent = '✓ Calendar is up to date · last updated '+d.toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
  } else {
    el.textContent = canEdit ? 'Not saved yet. The last-updated time will show here after you tap Save & publish.' : '';
  }
}

async function save(){
  if(!art) return;
  try{
    const clone = document.documentElement.cloneNode(true);
    clone.removeAttribute('data-theme');
    clone.querySelector('#root').innerHTML = '';
    const st = clone.querySelector('#state');
    const next = Object.assign({}, S, {booked:[...booked].sort(), updated:new Date().toISOString()});
    st.textContent = JSON.stringify(next).replace(/</g,'\\u003c');
    await art.publish('<!DOCTYPE html>\n'+clone.outerHTML);
  }catch(e){
    msg = 'Could not save ('+(e && e.code || 'error')+'). Please try again.';
    document.getElementById('msg').textContent = msg;
  }
}

const tg=document.getElementById('tg');
function paintTg(){tg.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀':'☾'}
tg.onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}paintTg()};
paintTg();
render();
(async()=>{
  try{
    if(typeof claude === 'undefined') return;
    art = await claude.use('artifact');
    const u = await claude.use('user');
    canEdit = !!(art && u && u.isOwner());
    render();
  }catch(e){}
})();
</script>
